<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Votación Escolar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Encabezado -->
    <div class="bg-indigo-600 p-6 text-white text-center">
      <h1 class="text-2xl font-bold tracking-tight">Elecciones Escolares</h1>
      <p class="text-indigo-100 text-sm mt-1">Tu voz cuenta. Elige a tus representantes.</p>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loading" class="p-8 text-center">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
      <p class="mt-4 text-slate-500 text-sm">Cargando sistema de votación...</p>
    </div>

    <!-- Mensaje de Votación Cerrada -->
    <div id="closed-screen" class="hidden p-8 text-center">
      <div class="text-5xl mb-3">🔒</div>
      <h2 class="text-xl font-bold text-slate-700">Votación Cerrada</h2>
      <p class="text-slate-500 text-sm mt-2">El proceso de votación no está activo en este momento.</p>
    </div>

    <!-- Paso 1: Ingreso de Código o Selección de Grupo -->
    <div id="auth-screen" class="hidden p-6">
      <div id="code-input-container">
        <label class="block text-sm font-semibold text-slate-700 mb-2">Código de Acceso Único</label>
        <input type="text" id="voter-code" placeholder="Ej: 10A-001" 
               class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none uppercase text-center font-mono text-lg tracking-wider">
      </div>

      <div id="group-select-container" class="hidden mt-4">
        <label class="block text-sm font-semibold text-slate-700 mb-2">Selecciona tu Grupo / Salón</label>
        <select id="voter-group-select" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
          <option value="">-- Elige tu salón --</option>
        </select>
      </div>

      <p id="auth-error" class="hidden text-red-600 text-xs font-medium mt-2 text-center bg-red-50 p-2 rounded-lg"></p>

      <button onclick="iniciarVotacion()" class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200">
        Ingresar a Votar
      </button>
    </div>

    <!-- Paso 2: Tarjetón de Votación -->
    <div id="ballot-screen" class="hidden p-6">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 mb-5 flex justify-between items-center">
        <span class="text-xs font-semibold text-indigo-800 uppercase">Grupo / Salón:</span>
        <span id="display-group" class="text-sm font-bold text-indigo-700 bg-white px-3 py-1 rounded-lg shadow-sm"></span>
      </div>

      <form id="voting-form" onsubmit="enviarVoto(event)">
        <div id="categories-container" class="space-y-6">
          <!-- Aquí se cargan dinámicamente las categorías y candidatos -->
        </div>

        <p id="vote-error" class="hidden text-red-600 text-xs font-medium mt-4 text-center bg-red-50 p-2 rounded-lg"></p>

        <button type="submit" id="submit-btn" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition duration-200">
          Confirmar y Enviar Voto
        </button>
      </form>
    </div>

    <!-- Paso 3: Confirmación Final -->
    <div id="success-screen" class="hidden p-8 text-center">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl mb-4">✓</div>
      <h2 class="text-2xl font-bold text-slate-800">¡Voto Registrado!</h2>
      <p id="success-msg" class="text-slate-600 text-sm mt-2">Tu participación ha sido guardada correctamente.</p>
    </div>
  </div>

  <script>
    // =========================================================================
    // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbyQoK7aEPK1gGNtXxQOPf4xIDRkF0kBFlBoNN7xjh9-dak64r13TnT_KCYqAHXt1ZgZ-w/exec";
    // =========================================================================

    let appData = null;
    let currentCode = "";
    let currentGroup = "";

    // Al cargar la página, consultamos la hoja de cálculo
    window.onload = async () => {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        appData = await res.json();
        
        document.getElementById("loading").classList.add("hidden");

        if (appData.config.estado_votacion !== "ABIERTO") {
          document.getElementById("closed-screen").classList.remove("hidden");
          return;
        }

        document.getElementById("auth-screen").classList.remove("hidden");

        // Verificar si es modo CODIGO o modo LIBRE
        if (appData.config.modo_votacion === "LIBRE") {
          document.getElementById("code-input-container").classList.add("hidden");
          document.getElementById("group-select-container").classList.remove("hidden");
          
          // Llenar selector de grupos únicos desde los candidatos
          const grupos = [...new Set(appData.candidatos.map(c => c.grupo))];
          const select = document.getElementById("voter-group-select");
          grupos.forEach(g => {
            const opt = document.createElement("option");
            opt.value = g;
            opt.textContent = g;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        document.getElementById("loading").innerHTML = `<p class="text-red-500 text-sm">Error de conexión con la base de datos. Verifica la URL del script.</p>`;
      }
    };

    function iniciarVotacion() {
      const errorEl = document.getElementById("auth-error");
      errorEl.classList.add("hidden");

      if (appData.config.modo_votacion === "CODIGO") {
        const codeInput = document.getElementById("voter-code").value.trim().toUpperCase();
        if (!codeInput) {
          mostrarErrorAuth("Por favor ingresa tu código único.");
          return;
        }
        // Extraer el grupo del prefijo del código (Ej: "10A-001" -> "10A")
        // Nota: Si tus códigos no tienen guion, el backend igual validará el grupo exacto al enviar.
        const partes = codeInput.split("-");
        if (partes.length < 2) {
          mostrarErrorAuth("Formato de código inválido. Debe ser como GRUPO-NUMERO (Ej: 10A-001).");
          return;
        }
        currentCode = codeInput;
        currentGroup = partes[0];
      } else {
        const groupSelect = document.getElementById("voter-group-select").value;
        if (!groupSelect) {
          mostrarErrorAuth("Por favor selecciona tu grupo.");
          return;
        }
        currentCode = "";
        currentGroup = groupSelect;
      }

      // Filtrar candidatos de ese grupo
      const candidatosDelGrupo = appData.candidatos.filter(c => c.grupo.toUpperCase() === currentGroup.toUpperCase());
      
      if (candidatosDelGrupo.length === 0) {
        mostrarErrorAuth(`No se encontraron candidatos registrados para el grupo "${currentGroup}". Verifica tu código.`);
        return;
      }

      construirTarjeton(candidatosDelGrupo);
    }

    function mostrarErrorAuth(msg) {
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = msg;
      errorEl.classList.remove("hidden");
    }

    function construirTarjeton(candidatos) {
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("ballot-screen").classList.remove("hidden");
      document.getElementById("display-group").textContent = currentGroup;

      const container = document.getElementById("categories-container");
      container.innerHTML = "";

      appData.categorias.forEach((categoria, index) => {
        const catDiv = document.createElement("div");
        catDiv.className = "bg-slate-50 p-4 rounded-xl border border-slate-200";
        
        let opcionesHtml = `<label class="block text-base font-bold text-slate-800 mb-3">${categoria}</label><div class="space-y-2">`;
        
        candidatos.forEach(cand => {
          opcionesHtml += `
            <label class="flex items-center p-3 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-indigo-400 transition">
              <input type="radio" name="cat_${index}" value="${cand.nombre}" data-categoria="${categoria}" required class="h-4 w-4 text-indigo-600 focus:ring-indigo-500">
              <span class="ml-3 text-sm font-medium text-slate-700">${cand.nombre}</span>
            </label>
          `;
        });

        opcionesHtml += `</div>`;
        catDiv.innerHTML = opcionesHtml;
        container.appendChild(catDiv);
      });
    }

    async function enviarVoto(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const errorEl = document.getElementById("vote-error");
      errorEl.classList.add("hidden");

      btn.disabled = true;
      btn.textContent = "Registrando voto...";

      // Recopilar respuestas
      const votos = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');
      radios.forEach(r => {
        const cat = r.getAttribute("data-categoria");
        votos[cat] = r.value;
      });

      try {
        const params = new URLSearchParams({
          action: "vote",
          codigo: currentCode,
          grupo: currentGroup,
          votos: JSON.stringify(votos)
        });

        const res = await fetch(`${API_URL}?${params.toString()}`);
        const result = await res.json();

        if (result.status === "success") {
          document.getElementById("ballot-screen").classList.add("hidden");
          document.getElementById("success-screen").classList.remove("hidden");
          document.getElementById("success-msg").textContent = result.message;
        } else {
          errorEl.textContent = result.message;
          errorEl.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Confirmar y Enviar Voto";
        }
      } catch (err) {
        errorEl.textContent = "Ocurrió un error al enviar el voto. Intenta de nuevo.";
        errorEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Confirmar y Enviar Voto";
      }
    }
  </script>
</body>
</html>
